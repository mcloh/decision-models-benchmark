[project]
name = "dmb"
version = "0.1.0"
description = "Benchmark de modelos de decisão PT-BR para roteamento em orquestrador multiagente"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23", "fastapi>=0.115", "uvicorn>=0.34", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["dmb*", "adapters*", "harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
